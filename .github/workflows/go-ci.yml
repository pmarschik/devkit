# Reusable CI for a Go repo. A consumer calls it from a five-line caller
# workflow — copy github/go/ci.yml out of this repo and commit it. GitHub Actions
# resolves `uses:` on every run, so a moved v1 tag reaches a caller at once. The
# mise include cache problem does not apply here.
#
# Every job installs the repo's own tools with mise and then runs a devkit task,
# so CI and a local `mise run` execute the same code.
name: go-ci

on:
  workflow_call:
    inputs:
      race:
        description: Also run the tests with -race
        type: boolean
        default: true
      vuln:
        description: Run govulncheck
        type: boolean
        default: true
      coverage-floor:
        description: Fail below this root-module coverage percentage. 0 disables the job.
        type: number
        default: 0
      snapshot-build:
        description: Cross-compile every release target with the repo's GoReleaser config
        type: boolean
        default: false
      goreleaser-config:
        description: GoReleaser config path, for snapshot-build
        type: string
        default: .config/goreleaser.yaml
      goreleaser-version:
        description: GoReleaser version constraint, for snapshot-build
        type: string
        default: "~> v2"
      runs-on:
        description: Runner label
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      # Lint, spell check and test every module in go.work. `ci` leaves the
      # tree alone, unlike the local `check`, which formats first.
      - run: mise run ci

  race:
    if: inputs.race
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run test -- -race

  coverage:
    if: inputs.coverage-floor > 0
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      # The root module only. A workspace-wide profile needs -coverpkg to name
      # every module, and the number it produces answers a different question.
      - name: Coverage floor
        shell: bash
        run: |
          go test -coverprofile=coverage.out -coverpkg=./... ./...
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub(/%/, "", $3); print $3 }')
          echo "total coverage: ${total}%"
          awk -v total="${total}" -v floor="${{ inputs.coverage-floor }}" \
            'BEGIN { exit (total + 0 < floor + 0) ? 1 : 0 }'

  vuln:
    if: inputs.vuln
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # For a repo that ships binaries. `mise run ci` builds for the runner alone,
  # which says nothing about the platforms the release covers — a build tag or
  # a syscall that only exists on Unix compiles clean here and breaks on the
  # tag. GoReleaser reads the targets from the config the release uses, so this
  # job cannot drift from what ships the way a matrix in the caller does.
  #
  # `build`, not `release`: no archives, no checksums, no publishing.
  snapshot-build:
    if: inputs.snapshot-build
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ inputs.goreleaser-version }}
          args: build --config ${{ inputs.goreleaser-config }} --snapshot --clean
